<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; }
    button { padding: 14px 22px; border: 0; border-radius: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Facebook Login</h2>
  <p>Continue with Facebook to sign in.</p>
  <button id="login">Continue with Facebook</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // We will replace these after your Meta/Facebook app is created.
    const FACEBOOK_APP_ID = "YOUR_FACEBOOK_APP_ID";
    const REDIRECT_URI = "https://YOUR-DOMAIN.example.com/auth/callback";

    document.getElementById("login").addEventListener("click", () => {
      const url =
        "https://www.facebook.com/dialog/oauth" +
        "?client_id=" + encodeURIComponent(FACEBOOK_APP_ID) +
        "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
        "&response_type=code" +
        "&scope=public_profile,email";

      window.location.href = url;
    });
  </script>
</body>
</html>
